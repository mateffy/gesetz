name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first — the CLI and adapters depend on compiled output.
      - run: pnpm build

      # Dogfood: build, then run gesetz against its own codebase.
      #
      # `pnpm dogfood` builds first on purpose. Running `pnpm check` alone uses
      # whatever is already in packages/*/dist, and a stale dist once meant the
      # dogfood silently evaluated an older version of its own rules.
      - run: pnpm dogfood

      # Full typecheck across all packages.
      - run: pnpm typecheck

      # Run all test suites.
      - run: pnpm test
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first — the CLI and adapters depend on compiled output, and the
      # packaging checks below need a dist to inspect.
      - run: pnpm build

      # ── Hard gates ──────────────────────────────────────────────────────────
      # These must pass for a release.

      # Packaging is valid: every `exports` entry resolves to a file the build
      # emits. This caught `@gesetz/core/reporters` pointing at
      # `dist/reporters.js` while tsdown writes `dist/reporters/index.js` — a
      # subpath that had been broken in every published 3.0.0-rc.
      - run: pnpm publint

      # Declarations match the runtime. `esm-only` is the correct profile: every
      # package is `"type": "module"` with ESM output, so the strict profile's
      # node10/require-of-ESM findings are expected rather than defects.
      - run: pnpm attw

      # Full typecheck across all packages.
      - run: pnpm typecheck

      # Run all test suites.
      - run: pnpm test

      # ── Aspirational gate ───────────────────────────────────────────────────
      # Dogfood: run gesetz against its own codebase.
      #
      # This is allowed to fail so that a red self-check cannot mask a real
      # typecheck/test regression — it used to run first, which meant failures in
      # the hard gates above were never reached. The step still shows as failed
      # in the run summary when it does not pass.
      #
      # Current state: `noDeepNesting` counts *indentation*, and this codebase
      # routinely indents to level 6 (Effect pipelines and nested callbacks), so
      # the rule reports ~237 warnings and the `structure` category scores 0.
      # Making this gate enforceable means either measuring real control-flow
      # nesting (AST-based, in @gesetz/typescript) or adopting a threshold that
      # reflects indentation-based counting. Until then it stays visible but
      # non-blocking.
      - run: pnpm check
        continue-on-error: true
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first — the CLI and adapters depend on compiled output, and the
      # packaging checks below need a dist to inspect.
      - run: pnpm build

      # ── Hard gates ──────────────────────────────────────────────────────────
      # These must pass for a release.

      # Packaging is valid: every `exports` entry resolves to a file the build
      # emits. This caught `@gesetz/core/reporters` pointing at
      # `dist/reporters.js` while tsdown writes `dist/reporters/index.js` — a
      # subpath that had been broken in every published 3.0.0-rc.
      #
      # `--pack=false` matters: publint's default is to pack each package, and
      # `npm pack` runs the package's `prepack` script — a full tsdown build per
      # package that this step does not need.
      - run: pnpm publint

      # Declarations match the runtime. `esm-only` is the correct profile: every
      # package is `"type": "module"` with ESM output, so the strict profile's
      # node10/require-of-ESM findings are expected rather than defects.
      #
      # `scripts/attw.mjs` packs with `--ignore-scripts` instead of using
      # `attw --pack`, which would run `prepack` (a tsdown build) once per
      # package — measured at ~6.4s and ~315 MB peak extra per package. It also
      # fails if a package has no `dist/`, so skipping the rebuild cannot hide an
      # unbuilt package.
      - run: pnpm attw

      # Full typecheck across all packages.
      - run: pnpm typecheck

      # Run all test suites.
      - run: pnpm test

      # ── Dogfood gate ────────────────────────────────────────────────────────
      # Gesetz checks its own codebase with `gesetz.config.ts`. Runs last so a
      # failure here cannot mask a typecheck/test regression, but it is a hard
      # gate: it passes, so a regression should fail the build.
      - run: pnpm check